# Simulation settings (src/simulation/, docs/simulation/getting_started.md).

# Per-minute counts, one parquet file per day (from 25 October 2026).
minute_feed_dir: data/raw/melbourne_portal/minute_feed
events_config: configs/events.yaml
# Inputs for the walkers.
routing_edges: data/interim/osm/melbourne/graph/routing_edges.parquet
sensor_segment_map: data/processed/features/melbourne/sensor_segment_map.parquet
venue_dist: data/processed/features/melbourne/osm_segment_venue_dist.parquet
counts_hourly: data/processed/features/melbourne/counts_hourly.parquet
minute_profiles: data/processed/features/melbourne/minute_profiles.parquet
event_days: data/processed/training/melbourne/event_days.parquet
# Simulation outputs. Not DVC-tracked (data/.gitignore).
output_dir: data/simulation

areas:
  # First area: crowds leaving concerts at Rod Laver Arena towards the city.
  melbourne_park:
    sensors: [161, 136, 123, 124, 75]
    # Peak delays at the other sensors are measured from this sensor's peak.
    lead_sensor: 161
    event_venue: rod_laver_arena
    event_kinds: [concert]
    # Other events at these venues on the same night are flagged: their crowds mix.
    nearby_venues: [rod_laver_arena, john_cain_arena, margaret_court_arena]
    # The egress window, in hours after the advertised start (no end times published).
    window_from_hours: 2.5
    window_to_hours: 5.0
    block_minutes: 5
    # Sensors in minute_profiles_meta.json that never publish minutes :00 to :04.
    exclude_sensors: []

    walkers:
      # Hours of the night whose observed hourly counts the walkers are fitted to.
      hours: [22, 23]
      # The usual count for each hour is subtracted, so only the event crowd is fitted:
      # a low percentile of the same weekday and hour over these weeks, skipping listed
      # event days. Melbourne Park has unlisted events most weeks, so not the median.
      baseline_weeks: 8
      baseline_quantile: 0.25
      # 136 is left out of the fit and is the test.
      fit_sensors: [161, 123, 124, 75]
      # Graph nodes on segments this close to the venue are the walkers' origins.
      origin_radius_m: 60
      # The graph is cut to the sensors' extent plus this margin.
      area_margin_m: 1500
      # Noisy shortest paths per destination, and the noise on each segment's cost.
      route_draws: 20
      route_noise: 0.6
      # How strongly the prior favours each destination's shorter routes.
      length_beta: 3.0
      # How strongly the fit is pulled towards the prior, against the sensor counts.
      prior_weight: 0.01
      speed_mps: 1.3
      seed: 7
      # Where the crowd heads, with the prior's share for each (check on a map).
      destinations:
        flinders_street_station: {lat: -37.8183, lon: 144.9671, weight: 4}
        richmond_station: {lat: -37.8244, lon: 144.9903, weight: 3}
        jolimont_station: {lat: -37.8166, lon: 144.9844, weight: 2}
        parliament_station: {lat: -37.8113, lon: 144.9730, weight: 1}

    # JuPedSim around the lead sensor (src/simulation/microsim.py).
    microsim:
      # Each route's corridor runs this far before and after the lead sensor.
      before_m: 150
      after_m: 150
      # Half the corridor's width. OSM has no width for most of these paths, so this is
      # an assumption to check on satellite imagery.
      half_width_m: 3.0
      # Agents start this far inside the corridor, across a few lanes.
      entry_inset_m: 1.0
      lateral_offsets_m: [-1.5, -0.75, 0.0, 0.75, 1.5]
      waypoint_spacing_m: 15.0
      waypoint_reach_m: 2.0
      exit_radius_m: 2.5
      agent_radius_m: 0.2
      # Simulation time step, how often entries and the counting line are checked, and
      # the longest run, in seconds and minutes.
      dt: 0.05
      check_s: 0.5
      max_minutes: 240
      seed: 7

    # The animated GIF of the walkers (src/simulation/animate.py).
    animation:
      start: "22:30"
      end: "23:30"
      # One frame per simulated minute, played at this many frames per second.
      frame_minutes: 1
      fps: 10
      width_px: 800
      dpi: 100
      # One walker in this many is drawn, so the dots don't merge into a line.
      sample_every: 5
      # Draw each route as a faint line under the dots (the still map shows them).
      draw_routes: false
      venue_name: Rod Laver Arena
      margin_m: 120
      # Label positions in points from the marker, where sensors sit close together.
      label_offsets: {124: [6, -14]}
