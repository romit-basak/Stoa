[project]
name = "stoa"
version = "0.1.0"
description = "Pedestrian flow prediction and scenario planning (IE7374)"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.0",
    "osmium>=4.0",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyogrio>=0.9",
    "pyyaml>=6",
    "rasterio>=1.4",
    "requests>=2.31",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
