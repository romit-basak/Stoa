# docker-compose overrides for the ops VM (ops/vm). The VM's .env selects this file with
# COMPOSE_FILE, so plain `docker compose` there uses it.
#
# The UIs listen on the VM's loopback only: the way in is an SSH tunnel through IAP
# (`ops/vm/vm.sh tunnel`), never the network, since Airflow here has no login.
services:
  mlflow:
    ports: !override
      - "127.0.0.1:5001:5000"
  airflow-apiserver:
    ports: !override
      - "127.0.0.1:8080:8080"
  # Tasks run in the scheduler (LocalExecutor). DVC's usage-analytics daemon forks after
  # google-cloud-storage has started gRPC threads; on the VM that crashed `dvc pull` with exit 1
  # after every file had been fetched (12 Nov). Analytics off avoids the fork.
  airflow-scheduler:
    environment:
      DVC_NO_ANALYTICS: "1"
