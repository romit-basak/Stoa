# Lint and unit tests on every pull request and on pushes to main.
# Tests that need downloaded data skip themselves, so this runs on a clean checkout.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the pinned dependencies
        run: |
          pip install -r requirements.txt
          pip install --no-deps -e .

      - name: Lint
        run: |
          ruff check src tests dags
          ruff format --check src tests dags

      - name: Unit tests
        run: python -m pytest -q
