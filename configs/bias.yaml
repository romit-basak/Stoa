# Data slices for bias analysis (src/bias/). See docs/bias/bias_slicing.md.
# Each slice splits the hourly table into groups. The representation report (step 1) shows how
# much data each group has against a reference: the hours in the study period for time and
# weather slices, the walkable network for place slices.
site: melbourne
# Rows flagged suspect_outage_zero are dropped before the shares are computed (training drops
# them too); each group still reports what share of its rows were flagged.
exclude_outage_rows: true

# Precincts are the City of Melbourne CLUE areas, with the three CBD areas merged.
precinct_groups:
  CBD Retail Core: CBD
  CBD East: CBD
  CBD West: CBD
# Sensors held out for the within-Melbourne transfer test, as listed in docs/PROJECT_CONTEXT.md
# section 7.1. These don't follow CLUE boundaries: Macaulay Rd (76, 85) is in the Kensington area.
holdout_precincts:
  unimelb_edge: [42, 43, 44]
  carlton: [31, 37, 46, 50, 54]
  north_melbourne: [70, 76, 85, 86, 87, 180]

# [start, end) local hours.
time_of_day:
  night: [0, 6]
  morning_peak: [6, 10]
  midday: [10, 16]
  evening_peak: [16, 20]
  late_evening: [20, 24]

# Bin edges; a value v falls in [edge_i, edge_i+1). The last bin is open.
rain_mm: {edges: [0, 0.1, 1.0], labels: [dry, light, rain]}
temperature_c: {edges: [-50, 10, 25, 30], labels: [cold, mild, warm, hot]}
slope_pct: {edges: [0, 1, 3, 5], labels: ["<1%", "1-3%", "3-5%", ">=5%"]}
missing_hours_share: {edges: [0, 0.05, 0.2], labels: ["<5%", "5-20%", ">=20%"]}
# Year each sensor's counts start (from Arshmehar's notebook).
sensor_start_year: {edges: [2009, 2014, 2019], labels: ["2009-2013", "2014-2018", "2019+"]}

# Eras run from each start date to the next. COVID and Metro Tunnel dates match counts_hourly
# in configs/features.yaml.
eras:
  pre_covid: "2009-01-01"
  covid: "2020-03-16"
  recovery: "2021-10-22"
  post_metro_tunnel: "2025-11-30"

# Sensors split into equal-sized tiers by mean hourly count, and by OSM amenities within 400 m
# of the matched segment (an urban-density proxy).
volume_tiers: [quiet, medium, busy]
amenity_tiers: [low, medium, high]
amenity_radius_m: 400

# Pairs of slices reported together: problems often show only where two slices meet.
crosstabs:
  - [time_of_day, rain]
  - [precinct, era]

# AFL match days at the two stadiums near the sensors (AFL Tables venue names).
afl_venues: {Docklands: marvel, M.C.G.: mcg}

# A group is flagged thin when it has fewer sensors than this, or when its share of rows (or
# sensors, for place slices) is under this fraction of its reference share.
thin_min_sensors: 5
thin_ratio_below: 0.5
