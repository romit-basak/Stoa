[project]
name = "stoa"
version = "0.1.0"
description = "Pedestrian flow prediction and scenario planning (IE7374)"
requires-python = ">=3.11"
dependencies = [
    "dvc[gs]>=3.50",  # data versioning; gs = Google Cloud Storage remote
    "fairlearn>=0.13",  # bias analysis: per-slice metrics (MIT)
    "geopandas>=1.0",
    "google-auth>=2.20",  # dvc_push finds bucket credentials the way gcloud tools do
    # Data validation. <2: GX 2.0 changes the API; >=1.9 has the Condition objects we use.
    "great-expectations>=1.9,<2",
    "holidays==0.105",  # pinned: holiday rules change between releases
    "lightgbm>=4.5",  # flow-model candidate (MIT)
    "matplotlib>=3.8",  # bias figures and the flow model's comparison charts (PSF/BSD-style)
    # Experiment tracking client (Apache-2.0); same version as the server in ops/mlflow.
    "mlflow-skinny==3.17.2",
    "numba>=0.60",
    "optuna>=3.6",  # hyperparameter search for the flow-model candidates (MIT)
    "osmium>=4.0",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyogrio>=0.9",
    "pyyaml>=6",
    "rasterio>=1.4",
    "requests>=2.31",
    "scikit-learn>=1.5",  # flow-model candidates and the bias baseline (BSD-3)
    "scipy>=1.13",
    "shap>=0.46",  # feature importance for the selected flow model (MIT)
    "shapely>=2.0",
    "skops>=0.16,<0.17",  # safe format MLflow saves scikit-learn models in (MIT)
    "xgboost>=2.1",  # flow-model candidate (Apache-2.0)
]

[project.optional-dependencies]
dev = ["networkx>=3.3", "pytest>=8", "ruff>=0.6"]  # networkx: reference values in tests

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# PEP 8 checks on top of ruff's defaults: pycodestyle errors and warnings (E, W) and naming (N).
extend-select = ["E", "W", "N"]
# Exception names describe the case (Conflict, MissingCredentials) rather than end in "Error".
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
# Notebooks are exploration, not the pipeline (README, "Notebooks are not the pipeline").
"notebooks/*.ipynb" = ["E501", "E731"]

[tool.ruff.lint.pycodestyle]
# The formatter wraps code at its default 88; comments and docstrings may run to 100 (PEP 8
# allows a team to agree on longer lines).
max-line-length = 100
