# Local Airflow for the Stoa data pipeline. Based on the official Airflow 3.3.2 compose file,
# trimmed to LocalExecutor (no Redis or Celery workers) since everything runs on one machine.
#
#   docker compose up -d --build    # first run builds the image (a few minutes)
#   open http://localhost:8080      # no login needed locally
#   docker compose down             # stop (add -v to also wipe the Airflow database)

x-airflow-common: &airflow-common
  image: stoa-airflow:latest
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: stoa-local-jwt-secret
    # Local development only: everyone who opens the UI is an admin, no password.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Failure alerts by email (Gmail SMTP). The values come from .env, which is git-ignored;
    # leave STOA_ALERT_EMAILS empty to turn alerts off.
    STOA_ALERT_EMAILS: ${STOA_ALERT_EMAILS:-}
    STOA_SMTP_USER: ${STOA_SMTP_USER:-}
    # dvc_push logs in to the DVC bucket as the stoa-airflow-dvc service account. The key
    # lives in .secrets/ (git-ignored), which the containers see through the repo mount.
    GOOGLE_APPLICATION_CREDENTIALS: /opt/stoa/.secrets/stoa-airflow-dvc.json
    AIRFLOW_CONN_SMTP_DEFAULT: '{"conn_type": "smtp", "host": "smtp.gmail.com", "port": 587, "login": "${STOA_SMTP_USER:-}", "password": "${STOA_SMTP_PASSWORD:-}", "extra": {"disable_ssl": true}}'
  volumes:
    - ./dags:/opt/airflow/dags
    - .:/opt/stoa # whole repo: tasks run src/ and write to data/ on the host
    - airflow-logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-init:
    <<: *airflow-common
    build: . # only this service builds; the others reuse the image
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db-volume:
  airflow-logs:
