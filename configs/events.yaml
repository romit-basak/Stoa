# Events near the Melbourne sensors that aren't AFL games (AFL comes from src.ingest.events and
# src.ingest.afl_attendance). Hand-kept, started 2026-10-25 so the per-minute archive
# (src/ingest/minute_feed.py) has labelled event days from its first weeks.
#
# Rules (tests/configs/test_events.py checks them):
# - Every event cites a source in `sources`, and every source has an archived copy, because
#   listing pages disappear after the event.
# - Only what the source says. Times are Melbourne local clock time; `end` and `expected_crowd`
#   stay null when the source doesn't give them. Features fill gaps with labelled defaults later.
# - One row per day for multi-day events. `duration_h` gives a length where the source has a
#   start but no end and the kind's default (configs/features.yaml, events) doesn't fit.
# - Venues are named by their OSM object in the pinned extract (data/raw/osm/melbourne.osm.pbf),
#   so their location comes from the map, not from typed-in coordinates. `scope: citywide` rows
#   (an observance like Halloween) have no venue.
#
# Kinds: cricket, football (soccer), basketball, netball, concert, graduation, halloween.

venues:
  mcg: {name: Melbourne Cricket Ground, osm: way/210337258}
  marvel: {name: Marvel Stadium, osm: way/22971441}
  aami_park: {name: AAMI Park, osm: way/60116158}
  rod_laver_arena: {name: Rod Laver Arena, osm: way/45738964}
  john_cain_arena: {name: John Cain Arena, osm: way/7243452}
  margaret_court_arena: {name: Margaret Court Arena, osm: way/126844336}
  old_melbourne_gaol: {name: Old Melbourne Gaol, osm: way/26564392}
  the_district: {name: The District Docklands, osm: way/37667836}
  # A street, not a building: the road ways named Harbour Esplanade in the extract.
  harbour_esplanade: {name: Harbour Esplanade, osm_name: Harbour Esplanade}

sources:
  mcg_events:
    url: https://www.mcg.org.au/events
    archived: https://web.archive.org/web/20261025054940/https://www.mcg.org.au/events
    retrieved: 2026-10-25
  marvel_events:
    url: https://www.marvelstadium.com.au/local-community-information-special-events
    archived: https://web.archive.org/web/20261025055003/https://www.marvelstadium.com.au/local-community-information-special-events
    retrieved: 2026-10-25
    note: Gate times are "TBC" for every event, so no start times are recorded.
  aami_park_events:
    url: https://aamipark.com.au/events/
    archived: https://web.archive.org/web/20261025055034/https://aamipark.com.au/events/
    retrieved: 2026-10-25
    note: First page of the listing only.
  melbourne_park_events:
    url: https://www.melbournepark.com.au/events/
    archived: https://web.archive.org/web/20261025055103/https://www.melbournepark.com.au/events/
    retrieved: 2026-10-25
    note: First page of 7 only; later November and December events are still to add.
  whatson_halloween:
    url: https://whatson.melbourne.vic.gov.au/article/the-best-halloween-events-in-melbourne
    archived: https://web.archive.org/web/20261025055126/https://whatson.melbourne.vic.gov.au/article/the-best-halloween-events-in-melbourne
    retrieved: 2026-10-25
    note: City of Melbourne's What's On. Gives dates but no times.
  melbourning_district_halloween:
    url: https://www.melbourning.com.au/2026/10/23/a-giant-halloween-trail-made-by-kids-is-coming-to-docklands/
    archived: https://web.archive.org/web/20261025055201/https://www.melbourning.com.au/2026/10/23/a-giant-halloween-trail-made-by-kids-is-coming-to-docklands/
    retrieved: 2026-10-25

