# Parameters for the OSM feature pipeline (src/features/). Paths are relative to the repo root.
# Site bboxes and timezones come from configs/data.yaml.
interim_dir: data/interim
processed_dir: data/processed

sites:
  melbourne:
    crs: 28355  # GDA94 / MGA zone 55 (metres), same as configs/analysis.yaml
    # The Metro Tunnel.
    recent_stations:
      - {name: Arden, opened: "2025-11-30"}
      - {name: Parkville, opened: "2025-11-30"}
      - {name: State Library, opened: "2025-11-30"}
      - {name: Town Hall, opened: "2025-11-30"}
      - {name: Anzac, opened: "2025-11-30"}
  neu_boston:
    crs: 26919  # NAD83 / UTM 19N
  nyc:
    crs: 32618  # WGS 84 / UTM 18N

walk_filter:
  # Based on OSMnx's "walk" network filter. A way is walkable if it has a highway tag not listed
  # here, is not an area, and none of the access rules below exclude it.
  exclude_highway:
    [abandoned, bus_guideway, construction, cycleway, motorway, motorway_link, "no", planned,
     platform, proposed, raceway, razed, bus_stop, rest_area, services]
  exclude_tag_values:
    foot: ["no"]
    access: [private, "no"]
    service: [private]
  # Cycleways are excluded above unless pedestrians are explicitly allowed on them.
  cycleway_foot_values: ["yes", designated, permissive]

# Way tags kept on graph segments.
way_tags:
  [highway, footway, sidewalk, "sidewalk:both", "sidewalk:left", "sidewalk:right", surface, lit,
   width, incline, access, foot, crossing, indoor, layer, level, bridge, tunnel, covered, name]

paved_surfaces:
  [paved, asphalt, concrete, "concrete:plates", "concrete:lanes", paving_stones, sett,
   unhewn_cobblestone, cobblestone, metal, wood, bricks, tiles]

# POI taxonomy: category -> list of key=value tag matches ("key=*" matches any value).
# A POI can fall into several categories (e.g. a cafe is also "attractor").
poi_categories:
  food_drink: ["amenity=cafe", "amenity=restaurant", "amenity=fast_food", "amenity=bar",
               "amenity=pub", "amenity=food_court", "amenity=ice_cream", "amenity=biergarten"]
  retail: ["shop=*"]
  toilets: ["amenity=toilets"]
  drinking_water: ["amenity=drinking_water", "drinking_water=yes"]
  bench: ["amenity=bench", "leisure=picnic_table"]
  education: ["amenity=school", "amenity=university", "amenity=college", "amenity=library",
              "amenity=kindergarten", "building=university"]
  culture_entertainment: ["amenity=theatre", "amenity=cinema", "amenity=arts_centre",
                          "amenity=nightclub", "tourism=museum", "tourism=gallery",
                          "tourism=attraction", "leisure=stadium", "amenity=events_venue"]
  healthcare: ["amenity=hospital", "amenity=clinic", "amenity=doctors", "amenity=pharmacy",
               "amenity=dentist"]
  services: ["amenity=bank", "amenity=atm", "amenity=post_office", "office=*",
             "amenity=townhall", "amenity=courthouse"]
  worship: ["amenity=place_of_worship"]
  tourism_lodging: ["tourism=hotel", "tourism=hostel", "tourism=motel", "tourism=apartment",
                    "tourism=guest_house"]

# Transit, from points/polygons. Stops are matched on these tags.
transit:
  tram_stop: ["railway=tram_stop"]
  bus_stop: ["highway=bus_stop"]
  rail_station: ["railway=station"]
  # Stations that opened during a site's count record are listed per site (`recent_stations`
  # under `sites`). Their distances go in a separate column, so the training frame can ignore
  # them before the opening date (the OSM snapshot postdates it). Names are matched
  # case-insensitively against the station's OSM name.

green_tags: ["leisure=park", "leisure=garden", "leisure=nature_reserve", "landuse=grass",
             "landuse=recreation_ground", "landuse=village_green", "landuse=forest",
             "natural=wood", "natural=scrub"]

amenities:
  radii_m: [100, 200, 400]
  snap_max_m: 50          # POIs farther than this from any graph node are dropped (and counted)
  open_hours_radius_m: 200
  open_hours_categories: [food_drink, retail, culture_entertainment, services]

built_form:
  buffer_m: 25            # building coverage around each segment
  max_distance_m: 2000    # distance features are capped here (and flagged as "none nearby")

network_metrics:
  radii_m: [400, 800, 1600]
  workers: 8              # processes for the source loop; 0 = os.cpu_count()

sensor_match:
  search_radius_m: 30
  candidates: 3
  review_if_nearest_over_m: 15
  review_if_runner_up_within_m: 3
  # Segment classes a footpath sensor should land on before a road centreline (cycleways in the
  # graph allow pedestrians: they are shared paths).
  preferred_highway: [footway, pedestrian, path, steps, living_street, corridor, cycleway]
  # Hand-checked choices: location_id -> segment_id. Re-runs use these instead of the automatic pick.
  overrides_file: configs/sensor_overrides.yaml

counts_hourly:
  # Hourly training table for Melbourne: counts + time + weather + calendars + sensor match.
  # See docs/features/counts_hourly.md.
  site: melbourne
  # Open-Meteo values that describe the hour *before* their timestamp (sums and means). A count for
  # hour h covers h:00-h+1:00, so these join from the weather row stamped h+1. Everything else is
  # an instantaneous value at the stamp and joins from row h.
  weather_interval_vars: [precipitation, rain, shortwave_radiation]
  # A run of at least this many consecutive zero-count hours, with at least one of them in the
  # daytime window, is flagged as a likely sensor outage rather than a genuinely empty street.
  outage_zero_run_hours: 3
  outage_daytime_hours: [8, 20]
  # Victoria's COVID period: state of emergency declared 16 March 2020; Melbourne's sixth and last
  # lockdown ended 21 October 2021. Flagged, not dropped.
  covid_period: ["2020-03-16", "2021-10-21"]
  # Metro Tunnel stations opened (structural break; see CLAUDE.md "Generalization").
  metro_tunnel_opened: "2025-11-30"

sensor_steepness:
  # Footpath slope and elevation per count sensor (src/features/sensor_steepness.py).
  site: melbourne
  max_match_m: 25        # nearest footpath-steepness section must be this close
  min_section_m: 5       # shorter sections are skipped: their grades reach 580%
  local_radius_m: 25     # length-weighted mean slope over sections this close
  dem_offset_m: 10       # DEM fallback: terrain slope from samples this far to each side

# Training frame (src/features/training_frame.py): splits by location for every model.
training_frame:
  folds: 5
  seed: 7
  # Sensors within this distance of each other share a group, so neighbours on one street are
  # never split between training and testing.
  group_radius_m: 200
